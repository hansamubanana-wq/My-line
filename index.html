<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINE風チャット（名前設定＆既読機能付き）</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
        }
        body {
            background-color: #7494c0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            max-height: 800px;
            background-color: #7494c0;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        
        /* ヘッダー部分（名前変更機能付き） */
        .chat-header {
            background-color: #273246;
            color: #ffffff;
            padding: 12px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .chat-header .title { font-weight: bold; font-size: 1.05rem; }
        .name-setter {
            display: flex;
            gap: 5px;
            width: 100%;
            max-width: 300px;
        }
        .name-input {
            flex: 1;
            padding: 4px 10px;
            border-radius: 4px;
            border: none;
            font-size: 0.85rem;
            outline: none;
        }
        .save-name-btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: bold;
        }

        .chat-log {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            display: flex;
            align-items: flex-end;
            max-width: 75%;
        }
        .message.received { align-self: flex-start; }
        .message.received .bubble {
            background-color: #ffffff;
            color: #000000;
            border-radius: 15px 15px 15px 0;
            margin-left: 10px;
        }
        .avatar {
            width: 40px;
            height: 40px;
            background-color: #e5e7eb;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.75rem;
            font-weight: bold;
            color: #4b5563;
            flex-shrink: 0;
            border: 1px solid #ccc;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding: 2px;
        }
        .message.sent {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        .message.sent .bubble {
            background-color: #85e249;
            color: #000000;
            border-radius: 15px 15px 0 15px;
            margin-right: 10px;
        }
        .bubble {
            padding: 10px 14px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-break: break-all;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            white-space: pre-wrap;
        }
        
        .status-area {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            margin: 0 5px;
        }
        .message.received .status-area { align-items: flex-start; }
        
        .read-status {
            font-size: 0.65rem;
            color: #e2ffc9;
            font-weight: bold;
            margin-bottom: 2px;
        }
        .time {
            font-size: 0.7rem;
            color: #ffffff;
            white-space: nowrap;
            opacity: 0.8;
        }

        .chat-footer {
            background-color: #ffffff;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .chat-input {
            flex: 1;
            border: none;
            background-color: #f0f0f0;
            padding: 10px 15px;
            border-radius: 20px;
            font-size: 0.95rem;
            outline: none;
        }
        .send-btn {
            background-color: #53b63e;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <div class="title">みんなのチャットルーム</div>
        <div class="name-setter">
            <input type="text" id="nameInput" class="name-input" placeholder="自分の名前を入力">
            <button id="saveNameBtn" class="save-name-btn">設定</button>
        </div>
    </div>
    <div class="chat-log" id="chatLog"></div>
    <div class="chat-footer">
        <input type="text" id="chatInput" class="chat-input" placeholder="メッセージを入力">
        <button id="sendBtn" class="send-btn">送信</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, doc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCbFEZH9VywEFumJRbbqPftEJAZJDb8hQ0",
        authDomain: "my-line-chat-f467e.firebaseapp.com",
        projectId: "my-line-chat-f467e",
        storageBucket: "my-line-chat-f467e.firebasestorage.app",
        messagingSenderId: "175651281929",
        appId: "1:175651281929:web:0644d6cd4449edbbfb6cd8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let currentUserId = null;
    let currentUserName = "";

    const chatLog = document.getElementById('chatLog');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const nameInput = document.getElementById('nameInput');
    const saveNameBtn = document.getElementById('saveNameBtn');

    // 1. 匿名ログイン
    signInAnonymously(auth).catch((error) => console.error("ログインエラー:", error));

    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUserId = user.uid;
            
            // ローカルストレージ（ブラウザの記憶機能）に保存された名前があればそれを使う
            const savedName = localStorage.getItem('chat_user_name');
            if (savedName) {
                currentUserName = savedName;
            } else {
                currentUserName = "ユーザー_" + currentUserId.substring(currentUserId.length - 4);
            }
            
            nameInput.value = currentUserName;
            startChatLiveUpdate();
        }
    });

    // 名前の保存処理
    saveNameBtn.addEventListener('click', () => {
        const inputName = nameInput.value.trim();
        if (inputName !== "") {
            currentUserName = inputName;
            localStorage.setItem('chat_user_name', inputName); // ブラウザに名前を記憶させる
            alert("名前を「" + inputName + "」に設定したよ！");
            startChatLiveUpdate(); // 画面の表示を更新
        }
    });

    // 2. メッセージ送信処理
    async function sendMessage() {
        const text = chatInput.value.trim();
        if (text === "" || !currentUserId) return;

        try {
            await addDoc(collection(db, "messages"), {
                userId: currentUserId,
                userName: currentUserName, // 設定した名前で送信されるよ
                messageText: text,
                timestamp: serverTimestamp(),
                readUsers: [currentUserId]
            });
            chatInput.value = "";
        } catch (error) {
            console.error("送信エラー: ", error);
            alert("送信に失敗しちゃった。Firebaseの設定を確認してみてね。");
        }
    }

    sendBtn.addEventListener('click', sendMessage);
    chatInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    // 3. リアルタイム同期
    function startChatLiveUpdate() {
        const q = query(collection(db, "messages"), orderBy("timestamp", "asc"));
        
        onSnapshot(q, (snapshot) => {
            chatLog.innerHTML = "";

            snapshot.forEach((snapshotDoc) => {
                const data = snapshotDoc.data();
                if (!data.timestamp) return;

                const date = data.timestamp.toDate();
                const timeStr = date.getHours() + ":" + String(date.getMinutes()).padStart(2, '0');
                const isMe = data.userId === currentUserId;

                if (!isMe && (!data.readUsers || !data.readUsers.includes(currentUserId))) {
                    const docRef = doc(db, "messages", snapshotDoc.id);
                    updateDoc(docRef, {
                        readUsers: arrayUnion(currentUserId)
                    });
                }

                const readCount = data.readUsers ? data.readUsers.length - 1 : 0;
                const readText = readCount > 0 ? (readCount === 1 ? "既読" : `既読 ${readCount}`) : "";

                let messageHtml = "";
                if (isMe) {
                    messageHtml = `
                        <div class="message sent">
                            <div class="bubble">${data.messageText}</div>
                            <div class="status-area">
                                <span class="read-status">${readText}</span>
                                <span class="time">${timeStr}</span>
                            </div>
                        </div>
                    `;
                } else {
                    // 相手のアイコン用の名前（最初の2文字を表示）
                    const displayName = data.userName || "他";
                    const shortName = displayName.substring(0, 2);
                    messageHtml = `
                        <div class="message received">
                            <div class="avatar" title="${displayName}">${shortName}</div>
                            <div class="bubble">${data.messageText}</div>
                            <div class="status-area">
                                <span class="time">${timeStr}</span>
                            </div>
                        </div>
                    `;
                }

                chatLog.insertAdjacentHTML('beforeend', messageHtml);
            });

            chatLog.scrollTop = chatLog.scrollHeight;
        });
    }
</script>

</body>
</html>
