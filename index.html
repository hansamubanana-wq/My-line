<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LINE風完全版チャット（メンバー一覧＆ログイン同期対応）</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="chat-container">
    
    <div id="authScreen" class="screen active">
        <div class="auth-box">
            <h2 id="authTitle">ログイン</h2>
            <input type="text" id="authName" class="auth-input" placeholder="あなたの名前（新規登録時のみ必須）">
            <input type="email" id="authEmail" class="auth-input" placeholder="メールアドレス">
            <input type="password" id="authPassword" class="auth-input" placeholder="パスワード（6文字以上）">
            <button id="authBtn" class="auth-btn">ログインする</button>
            <div class="auth-divider">または</div>
            <button id="googleAuthBtn" class="google-btn">
                <svg class="google-icon" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span>Googleでログイン</span>
            </button>
            <div id="authToggle" class="auth-toggle">アカウントを持っていない場合は新規登録</div>
        </div>
    </div>

    <div id="memberScreen" class="screen">
        <div class="header">
            <div class="header-top">
                <div class="title" id="memberMainTitle">友だち</div>
                <button class="logout-btn" id="logoutBtn1">ログアウト</button>
            </div>
        </div>
        <div class="list-content" style="display:flex; flex-direction:column; overflow:hidden;">
            <div id="myProfileCardContainer"></div>
            <div id="memberList" style="flex:1; overflow-y:auto;"></div>
        </div>
        <div class="tab-bar">
            <div class="tab-item active" id="tabMember">友だち</div>
            <div class="tab-item" id="tabTalk">トーク</div>
        </div>
    </div>

    <div id="listScreen" class="screen">
        <div class="header">
            <div class="header-top">
                <div class="title">トーク</div>
                <button class="logout-btn" id="logoutBtn2">ログアウト</button>
            </div>
        </div>
        <div class="create-room-box">
            <input type="text" id="roomInput" class="room-create-input" placeholder="合言葉でグループに参加、または新規作成">
            <button id="saveRoomBtn" class="room-create-btn">参加・作成</button>
        </div>
        <div class="list-content" id="roomList"></div>
        <div class="tab-bar">
            <div class="tab-item" id="tabMember2">友だち</div>
            <div class="tab-item active" id="tabTalk2">トーク</div>
        </div>
    </div>

    <div id="roomScreen" class="screen">
        <div class="header">
            <div class="header-top">
                <button id="backBtn" class="back-btn">◀ 戻る</button>
                <div class="title" id="chatTitle">グループチャット</div>
                <button id="menuBtn" class="menu-btn">︙</button>
            </div>
        </div>
        <!-- アナウンス（ピン留め）バー -->
        <div id="announcementBar" class="announcement-bar">
            <span class="announcement-icon">📢</span>
            <span id="announcementText" class="announcement-text">アナウンスはまだありません</span>
            <button id="closeAnnounceBtn" class="close-announce-btn">×</button>
        </div>
        <div class="chat-log" id="chatLog"></div>
        <!-- リプライプレビュー -->
        <div id="replyPreviewBox" class="reply-preview-box">
            <span id="replyPreviewText">〇〇さんへのリプライ</span>
            <button id="cancelReplyBtn" class="cancel-reply-btn">×</button>
        </div>
        <div class="chat-footer">
            <label for="imageInput" class="image-send-label">📎</label>
            <input type="file" id="imageInput" accept="image/*">
            <button id="stickerBtn" class="sticker-toggle-btn">😊</button>
            <input type="text" id="chatInput" class="chat-input" placeholder="メッセージを入力">
            <button id="sendBtn" class="send-btn">送信</button>
        </div>
        <!-- スタンプ選択パネル -->
        <div id="stickerPicker" class="sticker-picker"></div>
    </div>

    <!-- プロフィール編集モーダル -->
    <div id="profileModal" class="modal">
        <div class="modal-content">
            <h3>プロフィール設定</h3>
            <div class="profile-avatar-container">
                <div id="profileModalIcon" class="profile-avatar-preview">👤</div>
                <label for="profileIconInput" class="avatar-upload-btn">画像をアップロード</label>
                <input type="file" id="profileIconInput" accept="image/*" style="display:none;">
            </div>
            <div class="modal-input-group">
                <label for="profileModalName">お名前 (必須)</label>
                <input type="text" id="profileModalName" placeholder="お名前を入力してください">
            </div>
            <div class="modal-input-group">
                <label for="profileModalStatus">ステータスメッセージ (一言)</label>
                <input type="text" id="profileModalStatus" placeholder="今日の気分や予定など">
            </div>
            <div class="modal-btn-group">
                <button id="profileSaveBtn" class="modal-btn save">保存</button>
                <button id="profileCloseBtn" class="modal-btn cancel">閉じる</button>
            </div>
        </div>
    </div>

    <!-- グループ新規作成モーダル -->
    <div id="createRoomModal" class="modal">
        <div class="modal-content">
            <h3>グループ作成</h3>
            <div class="profile-avatar-container">
                <div id="createRoomModalIcon" class="profile-avatar-preview">👥</div>
                <label for="createRoomIconInput" class="avatar-upload-btn">アイコンを選択</label>
                <input type="file" id="createRoomIconInput" accept="image/*" style="display:none;">
            </div>
            <div class="modal-input-group">
                <label for="createRoomModalName">グループ名 (必須)</label>
                <input type="text" id="createRoomModalName" placeholder="グループ名を入力してください">
            </div>
            <div class="modal-btn-group">
                <button id="createRoomModalBtn" class="modal-btn save">作成</button>
                <button id="createRoomCloseBtn" class="modal-btn cancel">キャンセル</button>
            </div>
        </div>
    </div>

    <!-- グループメニュー（ドロワー） -->
    <div id="groupDrawer" class="drawer">
        <div class="drawer-content">
            <div class="drawer-header">
                <h3>トーク設定</h3>
                <button id="closeDrawerBtn" class="close-drawer-btn">×</button>
            </div>
            <div class="drawer-body">
                <div class="drawer-section">
                    <label>トークルーム名</label>
                    <div class="room-name-edit-box">
                        <input type="text" id="drawerRoomNameInput">
                        <button id="drawerRoomNameSaveBtn">変更</button>
                    </div>
                </div>
                <div class="drawer-section">
                    <label id="drawerMemberCount">メンバー (0)</label>
                    <div id="drawerMemberList" class="drawer-member-list">
                        <!-- メンバーがグリッド表示される -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- メッセージ操作メニュー（モーダル） -->
    <div id="messageActionModal" class="modal">
        <div class="modal-content" style="max-width: 300px; gap: 12px; text-align: center;">
            <h4 id="actionModalHeader" style="margin-bottom: 5px; color: #1f2937;">メッセージ操作</h4>
            <button id="actionReplyBtn" class="modal-btn save" style="background-color: #3b82f6;">↩ 返信 (リプライ)</button>
            <button id="actionAnnounceBtn" class="modal-btn save" style="background-color: #f59e0b;">📢 アナウンスに設定</button>
            <button id="actionUnsendBtn" class="modal-btn save" style="background-color: #ef4444; display: none;">✖ 送信取り消し</button>
            <button id="actionCloseBtn" class="modal-btn cancel">閉じる</button>
        </div>
    </div>

</div>

<script type="module" src="app.js"></script>

</body>
</html>
