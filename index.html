<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>my-line</title>
    <meta name="description" content="my-line">
    <meta property="og:title" content="my-line">
    <meta property="og:description" content="my-line">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://my-line-rho.vercel.app/icon.png">
    <meta name="theme-color" content="#273246">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='38' fill='%23273246'/%3E%3Cpath fill='%23a1c4fd' d='M48 50h96a12 12 0 0 1 12 12v53a12 12 0 0 1-12 12H82l-26 19v-19h-8a12 12 0 0 1-12-12V62a12 12 0 0 1 12-12Z'/%3E%3C/svg%3E">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="chat-container">
    
    <div id="authScreen" class="screen active">
        <form id="authForm" class="auth-box" autocomplete="off">
            <h2>my-line</h2>
            <label class="auth-label" for="authSchool">通っている学校の名前（漢字）</label>
            <input type="text" id="authSchool" class="auth-input" autocomplete="off" maxlength="40" required>
            <fieldset id="authColors" class="auth-colors">
                <legend class="auth-label">教室のカーテンの色（当てはまるものをすべて）</legend>
                <label class="color-card" style="background:#ffffff"><input type="checkbox" value="白" aria-label="白"></label>
                <label class="color-card" style="background:#566f5c"><input type="checkbox" value="緑" aria-label="緑"></label>
                <label class="color-card" style="background:#7cc6f0"><input type="checkbox" value="水色" aria-label="水色"></label>
                <label class="color-card" style="background:#fbf0a8"><input type="checkbox" value="淡い黄色" aria-label="淡い黄色"></label>
                <label class="color-card" style="background:#1f1f1f"><input type="checkbox" value="黒" aria-label="黒"></label>
                <label class="color-card" style="background:#1b2a6b"><input type="checkbox" value="紺" aria-label="紺"></label>
                <label class="color-card" style="background:#f08a00"><input type="checkbox" value="オレンジ" aria-label="オレンジ"></label>
                <label class="color-card" style="background:#7b4fb0"><input type="checkbox" value="紫" aria-label="紫"></label>
            </fieldset>
            <input type="text" id="authName" class="auth-input" aria-label="名前（必須）" placeholder="名前（必須）" maxlength="20" required>
            <button type="submit" id="authBtn" class="auth-btn" disabled>参加する</button>
            <p id="authError" class="auth-error" role="alert"></p>
        </form>
    </div>

    <div id="memberScreen" class="screen" inert>
        <div class="header">
            <div class="header-top">
                <div class="title" id="memberMainTitle">友だち</div>
            </div>
        </div>
        <div class="list-content" style="display:flex; flex-direction:column; overflow:hidden;">
            <div id="myProfileCardContainer"></div>
            <div id="memberList" style="flex:1; overflow-y:auto;"></div>
        </div>
        <div class="tab-bar">
            <button type="button" class="tab-item active" id="tabMember">友だち</button>
            <button type="button" class="tab-item" id="tabTalk">トーク</button>
        </div>
    </div>

    <div id="listScreen" class="screen" inert>
        <div class="header">
            <div class="header-top">
                <div class="title">トーク</div>
            </div>
        </div>
        <div class="create-room-box">
            <button id="saveRoomBtn" class="room-create-btn">グループ作成</button>
        </div>
        <div class="list-content" id="roomList"></div>
        <div class="tab-bar">
            <button type="button" class="tab-item" id="tabMember2">友だち</button>
            <button type="button" class="tab-item active" id="tabTalk2">トーク</button>
        </div>
    </div>

    <div id="roomScreen" class="screen" inert>
        <div class="header">
            <div class="header-top">
                <button id="backBtn" class="back-btn">◀ 戻る</button>
                <div class="title" id="chatTitle">グループチャット</div>
                <button id="menuBtn" class="menu-btn">︙</button>
            </div>
        </div>
        <!-- アナウンス（ピン留め）バー -->
        <div id="announcementBar" class="announcement-bar">
            <span class="announcement-icon">📢</span>
            <span id="announcementText" class="announcement-text">アナウンスはまだありません</span>
            <button id="closeAnnounceBtn" class="close-announce-btn">×</button>
        </div>
        <div class="chat-log" id="chatLog"></div>
        <!-- リプライプレビュー -->
        <div id="replyPreviewBox" class="reply-preview-box">
            <span id="replyPreviewText">〇〇さんへのリプライ</span>
            <button id="cancelReplyBtn" class="cancel-reply-btn">×</button>
        </div>
        <div class="chat-footer">
            <label for="imageInput" class="image-send-label">📎</label>
            <input type="file" id="imageInput" accept="image/*">
            <button id="stickerBtn" class="sticker-toggle-btn">😊</button>
            <input type="text" id="chatInput" class="chat-input" placeholder="メッセージを入力" aria-label="メッセージ" maxlength="2000">
            <button id="sendBtn" class="send-btn">送信</button>
        </div>
        <!-- スタンプ選択パネル -->
        <div id="stickerPicker" class="sticker-picker"></div>
    </div>

    <!-- プロフィール編集モーダル -->
    <div id="profileModal" class="modal">
        <div class="modal-content">
            <h3>プロフィール設定</h3>
            <div class="profile-avatar-container">
                <div id="profileModalIcon" class="profile-avatar-preview">👤</div>
                <label for="profileIconInput" class="avatar-upload-btn">画像をアップロード</label>
                <input type="file" id="profileIconInput" accept="image/*" style="display:none;">
            </div>
            <div class="modal-input-group">
                <label for="profileModalName">お名前 (必須)</label>
                <input type="text" id="profileModalName" placeholder="お名前を入力してください" maxlength="20" required>
            </div>
            <div class="modal-input-group">
                <label for="profileModalStatus">ステータスメッセージ (一言)</label>
                <input type="text" id="profileModalStatus" placeholder="今日の気分や予定など" maxlength="120">
            </div>
            <div class="modal-btn-group">
                <button id="profileSaveBtn" class="modal-btn save">保存</button>
                <button id="profileCloseBtn" class="modal-btn cancel">閉じる</button>
            </div>
        </div>
    </div>

    <!-- グループ新規作成モーダル -->
    <div id="createRoomModal" class="modal">
        <div class="modal-content">
            <h3>グループ作成</h3>
            <div class="profile-avatar-container">
                <div id="createRoomModalIcon" class="profile-avatar-preview">👥</div>
                <label for="createRoomIconInput" class="avatar-upload-btn">アイコンを選択</label>
                <input type="file" id="createRoomIconInput" accept="image/*" style="display:none;">
            </div>
            <div class="modal-input-group">
                <label for="createRoomModalName">グループ名 (必須)</label>
                <input type="text" id="createRoomModalName" placeholder="グループ名を入力してください" maxlength="40" required>
            </div>
            <fieldset class="group-members">
                <legend>メンバー</legend>
                <div id="createRoomMembers"></div>
            </fieldset>
            <div class="modal-btn-group">
                <button id="createRoomModalBtn" class="modal-btn save">作成</button>
                <button id="createRoomCloseBtn" class="modal-btn cancel">キャンセル</button>
            </div>
        </div>
    </div>

    <!-- グループメニュー（ドロワー） -->
    <div id="groupDrawer" class="drawer">
        <div class="drawer-content">
            <div class="drawer-header">
                <h3>トーク設定</h3>
                <button id="closeDrawerBtn" class="close-drawer-btn">×</button>
            </div>
            <div class="drawer-body">
                <div class="drawer-section">
                    <label>トークルーム名</label>
                    <div class="room-name-edit-box">
                        <input type="text" id="drawerRoomNameInput" maxlength="40">
                        <button id="drawerRoomNameSaveBtn">変更</button>
                    </div>
                </div>
                <div class="drawer-section">
                    <label id="drawerMemberCount">メンバー (0)</label>
                    <div id="drawerMemberList" class="drawer-member-list">
                        <!-- メンバーがグリッド表示される -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- メッセージ操作メニュー（モーダル） -->
    <div id="messageActionModal" class="modal">
        <div class="modal-content" style="max-width: 300px; gap: 12px; text-align: center;">
            <h4 id="actionModalHeader" style="margin-bottom: 5px; color: #1f2937;">メッセージ操作</h4>
            <button id="actionReplyBtn" class="modal-btn save" style="background-color: #3b82f6;">↩ 返信 (リプライ)</button>
            <button id="actionAnnounceBtn" class="modal-btn save" style="background-color: #f59e0b;">📢 アナウンスに設定</button>
            <button id="actionUnsendBtn" class="modal-btn save" style="background-color: #ef4444; display: none;">✖ 送信取り消し</button>
            <button id="actionCloseBtn" class="modal-btn cancel">閉じる</button>
        </div>
    </div>

</div>

<script type="module" src="app.js"></script>
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('Service Worker registered successfully!', reg.scope))
                .catch(err => console.error('Service Worker registration failed:', err));
        });
    }
</script>
</body>
</html>
