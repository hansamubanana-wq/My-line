<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINE風チャット（アカウント＆既読機能付き）</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
        }
        body {
            background-color: #7494c0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            max-height: 800px;
            background-color: #7494c0;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .chat-header {
            background-color: #273246;
            color: #ffffff;
            padding: 10px 15px;
            text-align: center;
        }
        .chat-header .title { font-weight: bold; font-size: 1.1rem; }
        .chat-header .user-info { font-size: 0.75rem; color: #ccc; margin-top: 2px; }

        .chat-log {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            display: flex;
            align-items: flex-end;
            max-width: 75%;
        }
        .message.received { align-self: flex-start; }
        .message.received .bubble {
            background-color: #ffffff;
            color: #000000;
            border-radius: 15px 15px 15px 0;
            margin-left: 10px;
        }
        .avatar {
            width: 40px;
            height: 40px;
            background-color: #ddd;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.75rem;
            font-weight: bold;
            color: #555;
            flex-shrink: 0;
        }
        .message.sent {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        .message.sent .bubble {
            background-color: #85e249;
            color: #000000;
            border-radius: 15px 15px 0 15px;
            margin-right: 10px;
        }
        .bubble {
            padding: 10px 14px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-break: break-all;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            white-space: pre-wrap;
        }
        
        /* 時間と既読の表示エリア */
        .status-area {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            margin: 0 5px;
        }
        .message.received .status-area { align-items: flex-start; }
        
        .read-status {
            font-size: 0.65rem;
            color: #e2ffc9;
            font-weight: bold;
            margin-bottom: 2px;
        }
        .time {
            font-size: 0.7rem;
            color: #ffffff;
            white-space: nowrap;
            opacity: 0.8;
        }

        .chat-footer {
            background-color: #ffffff;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .chat-input {
            flex: 1;
            border: none;
            background-color: #f0f0f0;
            padding: 10px 15px;
            border-radius: 20px;
            font-size: 0.95rem;
            outline: none;
        }
        .send-btn {
            background-color: #53b63e;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <div class="title">みんなのチャットルーム</div>
        <div class="user-info" id="userInfo">ログイン中...</div>
    </div>
    <div class="chat-log" id="chatLog"></div>
    <div class="chat-footer">
        <input type="text" id="chatInput" class="chat-input" placeholder="メッセージを入力">
        <button id="sendBtn" class="send-btn">送信</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, doc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCbFEZH9VywEFumJRbbqPftEJAZJDb8hQ0",
        authDomain: "my-line-chat-f467e.firebaseapp.com",
        projectId: "my-line-chat-f467e",
        storageBucket: "my-line-chat-f467e.firebasestorage.app",
        messagingSenderId: "175651281929",
        appId: "1:175651281929:web:0644d6cd4449edbbfb6cd8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let currentUserId = null;
    let currentUserName = "";

    const chatLog = document.getElementById('chatLog');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const userInfo = document.getElementById('userInfo');

    // 1. 【アカウント機能】匿名ログインを実行
    signInAnonymously(auth).catch((error) => console.error("ログインエラー:", error));

    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUserId = user.uid;
            // ユーザー名をIDの後ろ4桁にして分かりやすくする（例：ユーザー_abcd）
            currentUserName = "ユーザー_" + currentUserId.substring(currentUserId.length - 4);
            userInfo.textContent = `あなた: ${currentUserName}`;
            
            // ログインが完了したらメッセージの読み込みを開始
            startChatLiveUpdate();
        }
    });

    // 2. メッセージ送信処理
    async function sendMessage() {
        const text = chatInput.value.trim();
        if (text === "" || !currentUserId) return;

        try {
            await addDoc(collection(db, "messages"), {
                userId: currentUserId,
                userName: currentUserName,
                messageText: text,
                timestamp: serverTimestamp(),
                readUsers: [currentUserId] // 【既読機能】送った本人は最初から既読にする
            });
            chatInput.value = "";
        } catch (error) {
            console.error("送信エラー: ", error);
        }
    }

    sendBtn.addEventListener('click', sendMessage);
    chatInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    // 3. チャットのリアルタイム受信と【既読機能】の処理
    function startChatLiveUpdate() {
        const q = query(collection(db, "messages"), orderBy("timestamp", "asc"));
        
        onSnapshot(q, (snapshot) => {
            chatLog.innerHTML = "";

            snapshot.forEach((snapshotDoc) => {
                const data = snapshotDoc.data();
                if (!data.timestamp) return;

                const date = data.timestamp.toDate();
                const timeStr = date.getHours() + ":" + String(date.getMinutes()).padStart(2, '0');
                const isMe = data.userId === currentUserId;

                // 【既読機能のロジック】
                // 自分以外のメッセージで、まだ自分が既読をつけていなければ、データベースを更新して自分を既読に追加する
                if (!isMe && (!data.readUsers || !data.readUsers.includes(currentUserId))) {
                    const docRef = doc(db, "messages", snapshotDoc.id);
                    updateDoc(docRef, {
                        readUsers: arrayUnion(currentUserId)
                    });
                }

                // 自分以外の既読人数を計算（送った本人を除く既読がついた数）
                const readCount = data.readUsers ? data.readUsers.length - 1 : 0;
                // 1人でも読んだら「既読」、複数人なら「既読 2」のようにする
                const readText = readCount > 0 ? (readCount === 1 ? "既読" : `既読 ${readCount}`) : "";

                let messageHtml = "";
                if (isMe) {
                    messageHtml = `
                        <div class="message sent">
                            <div class="bubble">${data.messageText}</div>
                            <div class="status-area">
                                <span class="read-status">${readText}</span>
                                <span class="time">${timeStr}</span>
                            </div>
                        </div>
                    `;
                } else {
                    const shortName = data.userName ? data.userName.substring(data.userName.length - 2) : "他";
                    messageHtml = `
                        <div class="message received">
                            <div class="avatar">${shortName}</div>
                            <div class="bubble">${data.messageText}</div>
                            <div class="status-area">
                                <span class="time">${timeStr}</span>
                            </div>
                        </div>
                    `;
                }

                chatLog.insertAdjacentHTML('beforeend', messageHtml);
            });

            chatLog.scrollTop = chatLog.scrollHeight;
        });
    }
</script>

</body>
</html>
